name: Automated PYQ Sync

on:
  schedule:
    # Automatically run every day at 00:00 UTC (05:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Sync NalishJain PYQs
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔄 Sync Latest Courses from NalishJain/IIITD-PYQs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run sync

      - name: 🔍 Check for Data Changes
        id: check_changes
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain src/courseData.json public/courseData.json src/data/syncReport.json public/data/syncReport.json)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected in course data."
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected."
          fi

      - name: 🚀 Commit and Push Updated Course Data
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/courseData.json public/courseData.json src/data/syncReport.json public/data/syncReport.json
          git commit -m "chore(pyq): auto-sync course files from NalishJain/IIITD-PYQs [skip ci]"
          git push origin main || git push origin master

      - name: 🏗️ Verify Build
        if: steps.check_changes.outputs.has_changes == 'true'
        run: npm run build

